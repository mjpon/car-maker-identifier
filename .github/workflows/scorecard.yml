# OpenSSF Scorecard: rates the repo's supply-chain practices.
# Report only: results go to the Security tab as SARIF and are not published.
# Nothing here can fail a pull request; it runs on main, weekly, and by hand.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 10 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: scorecard
